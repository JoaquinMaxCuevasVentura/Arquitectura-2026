<text x="225" y="200" font-size="2.6"><tspan font-weight="bold">Montantes:</tspan> 2 piezas de 90 × 750 × 18, a plomo, con 420 mm entre ejes</text>
<text x="225" y="203.77" font-size="2.6">y el borde inferior a 1250 mm del piso. Fijación: 3 tornillos 5 × 60 con tarugos Ø8 por montante.</text>
<text x="225" y="207.54" font-size="2.6">Agujeros Ø8,5 de 15 mm de profundidad cada 25 mm sobre el eje: 27 agujeros, del 1 (abajo) al 27.</text>
<text x="225" y="211.31" font-size="2.6">Numerar con lápiz cada 5 agujeros. Pasadores: varilla lisa de acero Ø8 × 32 (15 mm dentro, 17 mm fuera),</text>
<text x="225" y="215.08" font-size="2.6">así no tocan el dorso del tablero. El listón superior (42 mm) se apoya en dos pasadores y queda atrapado por otros dos</text>
<text x="225" y="218.85" font-size="2.6">puestos dos agujeros más arriba: el tablero no se levanta con los trazos ascendentes. El listón inferior toca los montantes.</text>
<text x="225" y="222.62" font-size="2.6">Elegir el agujero con la calculadora del banco: el centro de la hoja queda a la altura del hombro (±12 mm).</text>
<text x="225" y="226.39" font-size="2.6">Si no se puede perforar el muro: atornillar los montantes a un tablero de 600 × 1200 apoyado en el muro</text>
<text x="225" y="230.16" font-size="2.6">y trabado al piso con un listón.</text>
