<text x="22" y="205" font-size="2.6"><tspan font-weight="bold">Piezas:</tspan> 2 cartelas (triángulos rectángulos de catetos 600 × 161, despuntados 20), 1 travesaño trasero 564 × 70, 1 tope transversal 600 × 30.</text>
<text x="22" y="208.77" font-size="2.6">Las dos cartelas salen de un rectángulo de 600 × 161 cortado en diagonal: la hipotenusa es la superficie de apoyo y debe quedar recta.</text>
<text x="22" y="212.54" font-size="2.6">El tablero inclinado a 15° es el puesto clásico del dibujo técnico: es la condición base de toda la serie.</text>
<text x="22" y="216.31" font-size="2.6">Si las entrevistas muestran que los participantes formados en tablero usaban otro ángulo, se cambia el cateto vertical</text>
<text x="22" y="220.08" font-size="2.6">(cateto = 600 × tan del ángulo) antes de la serie y se anota en el protocolo.</text>
<text x="22" y="223.85" font-size="2.6">Verificar el ángulo con un inclinómetro sobre la cara del tablero y anotarlo en la ficha. Fieltro antideslizante bajo las cartelas.</text>
