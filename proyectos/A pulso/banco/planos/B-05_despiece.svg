<text x="185" y="102" font-size="3.4" font-weight="bold">Herrajes y materiales</text>
<text x="185" y="109" font-size="2.6">· Medio tablero de terciado o multilaminado de 18 mm (1220 × 1220), una cara lisa.</text>
<text x="185" y="112.77" font-size="2.6">· 4 pasadores: varilla lisa de acero Ø8 × 32 (dos de apoyo y dos de traba).</text>
<text x="185" y="116.54" font-size="2.6">· 6 tarugos Ø8 y 6 tornillos 5 × 60 (montantes al muro).</text>
<text x="185" y="120.31" font-size="2.6">· 30 tornillos para madera 4 × 30 y cola vinílica.</text>
<text x="185" y="124.08" font-size="2.6">· Instrumentos de dibujo (C2, C3): regla T de 60 cm, escuadras de 45° y de 30/60°,</text>
<text x="185" y="127.85" font-size="2.6">  plantilla de rotulación ISO 3098 de 10 mm y estilógrafo de 1,0 (tipo B: trazo = h/10).</text>
<text x="185" y="131.62" font-size="2.6">· Herramientas (D): portaminas 0,5 HB (base), estilógrafo 0,35 o 0,5, papel vegetal A4.</text>
<text x="185" y="135.39" font-size="2.6">· Cinta de papel, fieltro antideslizante, inclinómetro (aplicación del teléfono).</text>
<text x="185" y="139.16" font-size="2.6"></text>
<text x="185" y="142.93" font-size="2.6">Ancho de corte supuesto: 4 mm. Verificar las medidas reales del tablero</text>
<text x="185" y="146.7" font-size="2.6">antes de cortar; listones, travesaños y topes pueden salir de recortes.</text>
