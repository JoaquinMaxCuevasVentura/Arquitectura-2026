<text x="185" y="84" font-size="3.4" font-weight="bold">Herrajes y materiales</text>
<text x="185" y="91" font-size="2.6">· Medio tablero de terciado o multilaminado de 18 mm (1220 × 1220), una cara lisa.</text>
<text x="185" y="94.77" font-size="2.6">· 4 pasadores: varilla lisa de acero Ø8 × 32 (dos de apoyo y dos de traba).</text>
<text x="185" y="98.54" font-size="2.6">· 6 tarugos Ø8 y 6 tornillos 5 × 60 (montantes al muro).</text>
<text x="185" y="102.31" font-size="2.6">· 30 tornillos para madera 4 × 30 y cola vinílica.</text>
<text x="185" y="106.08" font-size="2.6">· 4 prensas pequeñas (sargentos de 10 cm) para las plantillas de topes.</text>
<text x="185" y="109.85" font-size="2.6">· Tiento: varilla de madera Ø15 × 600 con una punta de espuma forrada en tela.</text>
<text x="185" y="113.62" font-size="2.6">· Plantillas de topes C1–C3: MDF de 5 mm cortado con láser (ver banco/plantillas).</text>
<text x="185" y="117.39" font-size="2.6">· D1: 4 hojas de lija de grano 150. D2: goma eva de 3–5 mm, tamaño A3 o mayor.</text>
<text x="185" y="121.16" font-size="2.6">· Cinta de papel, fieltro antideslizante, inclinómetro (aplicación del teléfono).</text>
<text x="185" y="124.93" font-size="2.6"></text>
<text x="185" y="128.7" font-size="2.6">Ancho de corte supuesto: 4 mm. Verificar las medidas reales del tablero</text>
<text x="185" y="132.47" font-size="2.6">antes de cortar; las piezas 2, 4 y 5 pueden salir de recortes.</text>
