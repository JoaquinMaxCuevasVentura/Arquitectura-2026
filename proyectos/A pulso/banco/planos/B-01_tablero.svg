<text x="22" y="205" font-size="2.6"><tspan font-weight="bold">Material:</tspan> terciado o multilaminado de 18 mm, cara de escritura lisa, lijada (grano 180) y con un sellador mate.</text>
<text x="22" y="208.77" font-size="2.6">Sin tornillos ni marcas en la cara de escritura. Cantos redondeados (r ≈ 2 mm).</text>
<text x="22" y="212.54" font-size="2.6">La hoja se fija siempre en el mismo lugar: centro a 200 mm del borde superior y centrada en el ancho.</text>
<text x="22" y="216.31" font-size="2.6">Marcar sus cuatro esquinas en la cara con lápiz suave o un grabado muy leve.</text>
<text x="22" y="220.08" font-size="2.6">Los dos listones son los apoyos del tablero en las tres posiciones:</text>
<text x="22" y="223.85" font-size="2.6">· B0, sobre la mesa: el tablero queda plano y elevado 18 mm.</text>
<text x="22" y="227.62" font-size="2.6">· B1, sobre el atril: los listones descansan en las hipotenusas de las cartelas.</text>
<text x="22" y="231.39" font-size="2.6">· B2, en el muro: el listón superior se apoya en dos pasadores de los montantes.</text>
</svg>