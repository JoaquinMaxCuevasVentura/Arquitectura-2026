<text x="22" y="205" font-size="2.6"><tspan font-weight="bold">Material:</tspan> terciado o multilaminado de 18 mm, cara de escritura lisa, lijada (grano 180) y con un sellador mate.</text>
<text x="22" y="208.77" font-size="2.6">Sin tornillos ni marcas en la cara de escritura. Cantos redondeados (r ≈ 2 mm).</text>
<text x="22" y="212.54" font-size="2.6">La hoja se fija siempre en el mismo lugar: centro a 200 mm del borde superior y centrada en el ancho.</text>
<text x="22" y="216.31" font-size="2.6">Marcar sus cuatro esquinas en la cara con lápiz suave o un grabado muy leve. Las pautas del proyecto son A4.</text>
<text x="22" y="220.08" font-size="2.6">Los dos listones son los apoyos del tablero en las cuatro posiciones:</text>
<text x="22" y="223.85" font-size="2.6">· B0, sobre la cuña de 15° (tablero de dibujo) y B3, sobre el atril de 45°: los listones descansan en las cartelas.</text>
<text x="22" y="227.62" font-size="2.6">· B1, sobre la mesa: el tablero queda plano y elevado 18 mm.</text>
<text x="22" y="231.39" font-size="2.6">· B2, en el muro (pizarra): el listón superior queda trabado entre dos pares de pasadores.</text>
<text x="22" y="235.16" font-size="2.6">El canto izquierdo del tablero debe quedar recto y liso: sobre él corre la regla T (condiciones C2 y C3).</text>
</svg>