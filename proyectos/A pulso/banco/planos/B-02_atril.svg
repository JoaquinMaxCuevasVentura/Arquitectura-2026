<text x="22" y="200" font-size="2.6"><tspan font-weight="bold">Piezas:</tspan> 2 cartelas (triángulos rectángulos de catetos 460, despuntados 30 en el vértice agudo), 1 travesaño trasero 564 × 70,</text>
<text x="22" y="203.77" font-size="2.6">1 travesaño superior 564 × 70 (opcional, en la parte alta del cateto vertical), 1 tope transversal 600 × 30 atornillado sobre las hipotenusas.</text>
<text x="22" y="207.54" font-size="2.6">Las dos cartelas salen de un cuadrado de 460 × 460 cortado en diagonal: la hipotenusa queda sobre el corte, que debe ser recto y limpio.</text>
<text x="22" y="211.31" font-size="2.6">El listón inferior del tablero apoya contra el tope; los dos listones descansan sobre las hipotenusas.</text>
<text x="22" y="215.08" font-size="2.6">Verificar 45° ± 1° con un inclinómetro (aplicación del teléfono) sobre la cara del tablero y anotarlo en la ficha.</text>
<text x="22" y="218.85" font-size="2.6">Antideslizante (fieltro o goma) bajo las cartelas.</text>
