family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E9 · Una tabla suelta vuelca con 219 N si alguien se sienta en su punta: no puede</text><text x="1140.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      ir solo posada, hay que trabarla.</text><text x="1140.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">La cuña vuelve, esta vez por el vuelco de la tabla y no por el concepto.</text><text x="1140.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E2b · Con tablas de 196 mm, ninguna junta queda entre 0,5 y 5 mm de 4 a 13 % de</text><text x="1140.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      humedad: la tabla debe medir ≤ 182 mm.</text><text x="1140.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">K5 · B1 sí cumple: la pieza más pesada es una tabla de 11,6 kg. En A, el tablero</text><text x="1140.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      de 59 kg falla siempre.</text><text x="1140.0" y="396.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a5562a" font-weight="normal" text-anchor="start">→ Ronda 4: B2 = 6 tablas de 164 mm con junta de 3 mm, clavija acuñada bajo el</text><text x="1140.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a5562a" font-weight="normal" text-anchor="start">      cabezal, lengüetas sueltas y apoyo central sobre el travesaño.</text></svg>