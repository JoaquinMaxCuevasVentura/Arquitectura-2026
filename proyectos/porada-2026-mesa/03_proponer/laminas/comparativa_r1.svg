stroke="#a5562a" stroke-width="1.2" stroke-dasharray="4 3"/><text x="1140.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">masa 138 kg · piedra 57.2 kg</text><text x="1140.0" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K1 · madera 86.1% del volumen</text><text x="1140.0" y="431.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K2 · flexión máx. en piedra 1.4 MPa (modelo b) / 2.9 MPa (modelo a)</text><text x="1140.0" y="450.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K3 · junta máx. 3.2 mm/lado</text><text x="1140.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K4 · vuelco en extremo sin piedra 1652 N (1.65 × P)</text><text x="1140.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K5 · más pesada: tablero 59.1 kg · piedra: pie izq 28.6 kg</text><text x="60.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="start">V3 · Solo madera (control)</text><text x="60.0" y="688.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a5562a" font-weight="normal" text-anchor="start">ACUÑAR / TRABAR</text><line x1="40.0" y1="844.0" x2="568.0" y2="844.0" stroke="#2b2b2b" stroke-width="1.6"/><rect x="142.4" y="767.0" width="5.6" height="34.0" fill="#e2cba3" stroke="#2b2b2b" stroke-width="0.9"/><rect x="460.0" y="767.0" width="5.6" height="34.0" fill="#e2cba3" stroke="#2b2b2b" stroke-width="0.9"/><rect x="126.0" y="773.0" width="356.0" height="22.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="148.0" y="714.0" width="12.0" height="112.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="448.0" y="714.0" width="12.0" height="112.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="146.0" y="826.0" width="16.0" height="18.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="446.0" y="826.0" width="16.0" height="18.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="146.0" y="702.0" width="16.0" height="12.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="446.0" y="702.0" width="16.0" height="12.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="64.0" y="694.0" width="480.0" height="8.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><text x="60.0" y="890.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">masa 88 kg · piedra 0.0 kg</text><text x="60.0" y="912.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K1 · madera 100.0% del volumen</text><text x="60.0" y="931.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">— K2 · sin piedra</text><text x="60.0" y="950.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K3 · sin juntas piedra-madera</text><text x="60.0" y="969.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K4 · vuelco en extremo sin piedra 1655 N (1.66 × P)</text><text x="60.0" y="988.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K5 · más pesada: tablero 59.1 kg</text><text x="600.0" y="670.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2b2b2b" font-weight="bold" text-anchor="start">LECTURA</text><text x="600.0" y="696.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E1 · V0: la barra de mármol no puede ser viga (9,9 MPa frente a 2,3; ni el mármol más resistente la salva). La madera tiene que cargarla.</text><text x="600.0" y="720.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E2 · V2: la caja de piedra necesita 1,8 mm de holgura por lado y en seco la junta llega a 3,2 mm; hay que acuñar el montante, y «hincar» pasa a ser «encajar y</text><text x="600.0" y="740.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      acuñar».</text><text x="600.0" y="764.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E3 · Con caballete a 450 mm y pie de 80 mm, ninguna versión resiste 2 P en el extremo sin lastre. La piedra de V0 suma +40 % y aun así no llega.</text><text x="600.0" y="788.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Lo resuelve la geometría: alargar el pie 50 mm hacia el extremo (pie simétrico de 180 mm) o llevar el caballete a ≤ 400 mm del extremo.</text><text x="600.0" y="812.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E4 · V1: la llave de mármol trabaja a flexión y necesita 53-75 mm de profundidad; en la espiga caben 37. La piedra no puede ser la llave.</text><text x="600.0" y="836.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">V3 (control): la llave de fresno cumple con 14-19 mm. El peso de la llave es ≤ 1 % del rozamiento que la sostiene: «el peso traba» se descarta.</text><text x="600.0" y="860.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E5 · Bertonio 1612: chakhua (montón) ≠ chhakhua (piedra hincada donde se atan los palos). La pregunta cambia: unión, no lastre.</text><text x="600.0" y="884.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a5562a" font-weight="normal" text-anchor="start">→ Ronda 2: V0b (la madera carga la piedra), V4 (la piedra solo a compresión) y V3 como control, con pie de 180 mm.</text></svg>