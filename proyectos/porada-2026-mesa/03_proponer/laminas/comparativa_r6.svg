Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K3 · junta máx. 1.1 mm/lado · entre tablas 0.8-4.8 mm</text><text x="600.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K4 · vuelco en extremo sin piedra 2326 N (2.33 × P)</text><text x="600.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K5 · más pesada: tabla 2 9.7 kg · piedra: collar izq 2.3 kg · caballete izq armado 1</text><text x="1140.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2b2b2b" font-weight="bold" text-anchor="start">LECTURA</text><text x="1140.0" y="196.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E12 · En AB (y en B2) la clavija y la cuña de las dos tablas centrales caen</text><text x="1140.0" y="216.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      dentro del montante: 8 cruces fuera de ensamble.</text><text x="1140.0" y="240.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">El modelo de prismas no comparaba piezas entre sí; apareció al pasar AB a planos</text><text x="1140.0" y="260.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      de construcción.</text><text x="1140.0" y="284.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">F1 · La clavija termina dentro del cabezal y la cuña lo atraviesa a lo largo: 0</text><text x="1140.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      cruces fuera de ensamble.</text><text x="1140.0" y="328.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">E8, E9 y E2b no cambian (1,0 mm; trabadas; 0,8-4,8 mm). El caballete encolado</text><text x="1140.0" y="348.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      pesa 15,9 kg: K5 sigue cumpliendo.</text><text x="1140.0" y="372.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Las cuñas asoman por los costados del cabezal: la cuña, verbo común de la mesa,</text><text x="1140.0" y="392.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">      queda a la vista en cada tabla.</text><text x="1140.0" y="416.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a5562a" font-weight="normal" text-anchor="start">→ F1 es la propuesta final, iteración 1. La cambian E6 (si el collar se lee como</text><text x="1140.0" y="436.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a5562a" font-weight="normal" text-anchor="start">      adorno: B2 con la misma corrección) y E10.</text></svg>