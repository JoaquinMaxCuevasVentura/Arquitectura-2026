text x="600.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K5 · más pesada: tablero 55.8 kg · piedra: piedra embutida 14.7 kg</text><text x="1140.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#2b2b2b" font-weight="bold" text-anchor="start">V4 · Collar</text><text x="1140.0" y="188.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#a5562a" font-weight="normal" text-anchor="start">ATRAVESAR / ACUÑAR</text><line x1="1120.0" y1="344.0" x2="1648.0" y2="344.0" stroke="#2b2b2b" stroke-width="1.6"/><rect x="1208.4" y="267.0" width="5.6" height="34.0" fill="#e2cba3" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1554.0" y="267.0" width="5.6" height="34.0" fill="#e2cba3" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1200.0" y="273.0" width="368.0" height="22.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1214.0" y="269.0" width="14.0" height="30.0" fill="url(#piedra)" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1540.0" y="269.0" width="14.0" height="30.0" fill="url(#piedra)" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1228.0" y="214.0" width="12.0" height="112.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1528.0" y="214.0" width="12.0" height="112.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1216.0" y="326.0" width="36.0" height="18.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1516.0" y="326.0" width="36.0" height="18.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1226.0" y="202.0" width="16.0" height="12.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1526.0" y="202.0" width="16.0" height="12.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1144.0" y="194.0" width="480.0" height="8.0" fill="#b98c63" stroke="#2b2b2b" stroke-width="0.9"/><rect x="1214.0" y="269.0" width="14.0" height="30.0" fill="none" stroke="#a5562a" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="1540.0" y="269.0" width="14.0" height="30.0" fill="none" stroke="#a5562a" stroke-width="1.3" stroke-dasharray="4 3"/><text x="1140.0" y="390.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2b2b2b" font-weight="normal" text-anchor="start">masa 101 kg · piedra 4.6 kg</text><text x="1140.0" y="412.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K1 · madera 98.9% del volumen</text><text x="1140.0" y="431.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K2 · flexión máx. en piedra 0.0 MPa (modelo b) / 0.0 MPa (modelo a)</text><text x="1140.0" y="450.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K3 · junta máx. 1.1 mm/lado</text><text x="1140.0" y="469.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✓ K4 · vuelco en extremo sin piedra 2212 N (2.21 × P)</text><text x="1140.0" y="488.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2b2b2b" font-weight="normal" text-anchor="start">✗ K5 · más pesada: tablero 59.1 kg · piedra: collar izq 2.3 kg</text><text x="60.0" y="570.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2b2b2b" font-weight="bold" text-anchor="start">LECTURA</text><text x="60.0" y="596.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">V4 · La espiga atraviesa el collar de piedra y la llave de fresno lo aprieta contra el montante: la piedra solo trabaja a compresión (0,08-0,17 MPa).</text><text x="60.0" y="620.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">Lo que hace: reparte el apoyo de la llave sobre el montante (0,64 → 0,08 MPa). Es real, pero la madera no lo necesita (resiste 2,3).</text><text x="60.0" y="644.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">V0b · La piedra asentada en un canal, sin cola: junta de 0,9 a 2 mm por lado. Aporta +16 % al vuelco: por el prerregistro, se retira «la piedra estabiliza».</text><text x="60.0" y="668.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">V3 · Cumple lo mismo que V4 sin piedra. En ninguna versión la piedra se justifica por la estructura:</text><text x="60.0" y="692.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">tiene que justificarse por lo que responda E6 (nodo a 1:1, percepción y montaje), o salir.</text><text x="60.0" y="716.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#2b2b2b" font-weight="normal" text-anchor="start">K5 · Falla en todas por el tablero (59 kg en una pieza): es un problema común, no de la piedra.</text><text x="60.0" y="740.0" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#a5562a" font-weight="normal" text-anchor="start">→ Siguiente: E6 con V4 y V3 lado a lado; E7 (ganadores 2017-2018); decidir el mármol y el nombre (O6).</text></svg>